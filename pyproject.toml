[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "onleiharr"
dynamic = ["version"]
description = "Onleihe watcher with notifications and auto-rent"
authors = [{ name = "Onleiharr Maintainers" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "apprise",
  "httpx>=0.25",
  "tomli; python_version < '3.11'",
]

keywords = ["onleiharr", "onleihe"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Intended Audience :: End Users/Desktop",
  "Environment :: Console",
]

[project.optional-dependencies]
external-auth = ["playwright>=1.50"]

[project.urls]
Homepage = "https://github.com/nzb-tuxxx/Onleiharr"
Repository = "https://github.com/nzb-tuxxx/Onleiharr"
Issues = "https://github.com/nzb-tuxxx/Onleiharr/issues"

[project.scripts]
onleiharr = "onleiharr.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "onleiharr/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["onleiharr"]

[tool.hatch.build.targets.sdist]
include = [
  "/onleiharr",
  "/tests",
  "/README.md",
  "/DISCLAIMER.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "private_live: live non-invasive tests that require credentials",
  "invasive_live: live tests that may mutate account state and must be explicitly enabled",
]
